[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdk-ssm-secret-checker"
version = "0.1.0"
description = "Secrets checker for the SSM-as-secret-store + public repos + CDK pattern: pre-commit, CI, and value-aware sweep modes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC0-1.0" }
authors = [{ name = "Martin Harris" }]
keywords = ["cdk", "ssm", "secrets", "pre-commit", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
cssc = "cdk_ssm_secret_checker.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
